# Exact path allowlist. No direct access to source, config, or SQL.
ServerName localhost
ServerTokens Prod
ServerSignature Off
<Directory "/var/www/html">
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>
RewriteEngine On
RewriteRule ^/$ - [END]
RewriteRule ^/(?:Admin/(?:account-(?:create|edit)|accounts|admin-dashboard|enrollment-(?:correct|requests|review)|program-(?:create|edit)|programs|schedule-(?:create|edit)|schedules|section-(?:create|edit)|sections|student-(?:create|edit)|students|subject-(?:create|edit)|subjects)\.php|student/(?:enroll|my-enrollments|my-profile|student-dashboard)\.php|pages/(?:account-settings|enrollment-record)\.php|assets/(?:app\.js|favicon\.svg)|index\.php|logout\.php|main\.css)$ - [END]
RewriteRule ^ - [F,END]
Header always set X-Content-Type-Options "nosniff"
